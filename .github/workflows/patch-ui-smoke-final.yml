name: Patch final RC4 browser smoke

on:
  push:
    branches: [fix/rc4-icons-and-smoke]
    paths:
      - .github/workflows/patch-ui-smoke-final.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final browser-smoke fixes
        run: python3 .github/scripts/patch-ui-smoke-final.py
      - name: Commit final smoke and remove one-shot files
        shell: bash
        run: |
          rm .github/scripts/patch-ui-smoke-final.py .github/workflows/patch-ui-smoke-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ui-smoke-rc4.yml .github/scripts/patch-ui-smoke-final.py .github/workflows/patch-ui-smoke-final.yml
          git commit -m "test: finalize RC4 browser UI gate"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
