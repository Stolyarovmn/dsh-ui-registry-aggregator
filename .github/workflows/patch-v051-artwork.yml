name: Strengthen v0.5.1 artwork fallback

on:
  push:
    branches:
      - dsh-0.2.0

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Patch npm/GitHub artwork fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('source-core.js')
          source = path.read_text()
          before = """async function resolveNpmIcon(item, options) {
            const packageName = validPackageName(item?.packageName)
            const version = text(item?.version)
            if (!packageName || !version) return undefined
            const manifest = await npmManifest(item, options)
            const icon = safeIconPath(manifest?.icon)
            if (!icon) return undefined
            const packagePath = packageName.startsWith('@')
              ? packageName.split('/').map(part => encodeURIComponent(part)).join('/')
              : encodeURIComponent(packageName)
            const iconUrl = 'https://unpkg.com/' + packagePath + '@' + encodeURIComponent(version) + '/' + encodedPath(icon.path)
            return iconDataFromUrl(iconUrl, icon.mediaType, options)
          }
          """
          after = """async function resolveNpmIcon(item, options) {
            const packageName = validPackageName(item?.packageName)
            const version = text(item?.version)
            if (!packageName || !version) return undefined
            const manifest = await npmManifest(item, options)
            const icon = safeIconPath(manifest?.icon)
            if (icon) {
              const packagePath = packageName.startsWith('@')
                ? packageName.split('/').map(part => encodeURIComponent(part)).join('/')
                : encodeURIComponent(packageName)
              const iconUrl = 'https://unpkg.com/' + packagePath + '@' + encodeURIComponent(version) + '/' + encodedPath(icon.path)
              return iconDataFromUrl(iconUrl, icon.mediaType, options)
            }
            const parts = githubRepositoryParts(manifestRepositoryUrl(manifest))
            return parts ? githubReadmeIcon(parts, options) : undefined
          }
          """
          if before not in source:
              raise SystemExit('resolveNpmIcon marker not found')
          source = source.replace(before, after, 1)

          before = """async function resolveGithubIcon(item, options) {
            const parts = githubRepositoryParts(item?.repository)
            if (!parts) return undefined
            const manifest = await githubManifest(item, options)
            const icon = safeIconPath(manifest?.icon)
            if (icon) {
              const iconUrl = 'https://raw.githubusercontent.com/' + encodeURIComponent(parts.owner) + '/' + encodeURIComponent(parts.repo) + '/HEAD/' + encodedPath(icon.path)
              return iconDataFromUrl(iconUrl, icon.mediaType, options)
            }
            return githubReadmeIcon(parts, options)
          }
          """
          after = """async function resolveGithubIcon(item, options) {
            const parts = githubRepositoryParts(item?.repository)
            if (!parts) return undefined
            let manifest
            try {
              manifest = await githubManifest(item, options)
            } catch {
              manifest = undefined
            }
            const icon = safeIconPath(manifest?.icon)
            if (icon) {
              const iconUrl = 'https://raw.githubusercontent.com/' + encodeURIComponent(parts.owner) + '/' + encodeURIComponent(parts.repo) + '/HEAD/' + encodedPath(icon.path)
              return iconDataFromUrl(iconUrl, icon.mediaType, options)
            }
            return githubReadmeIcon(parts, options)
          }
          """
          if before not in source:
              raise SystemExit('resolveGithubIcon marker not found')
          path.write_text(source.replace(before, after, 1))

          path = Path('test/source-core.test.js')
          source = path.read_text()
          source = source.replace(
              "return Response.json({ name: '@acme/dsh-readme-icon', version: '1.2.5' })",
              "return Response.json({ name: '@acme/dsh-readme-icon', version: '1.2.5', repository: { url: 'git+https://github.com/acme/dsh-readme-icon.git' } })",
              1,
          )
          source = source.replace(
              "      version: '1.2.5',\n      repository: 'https://github.com/acme/dsh-readme-icon',",
              "      version: '1.2.5',",
              1,
          )
          path.write_text(source)
          PY

      - name: Install test dependencies
        run: npm install --package-lock=false --legacy-peer-deps

      - name: Check syntax
        run: |
          node --check source-core.js
          node --check test/source-core.test.js

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm run test:pack

      - name: Commit verified patch
        shell: bash
        run: |
          git rm .github/workflows/patch-v051-artwork.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-core.js test/source-core.test.js
          git commit -m "fix: recover plugin artwork from npm repository metadata"
          git push origin HEAD:dsh-0.2.0
