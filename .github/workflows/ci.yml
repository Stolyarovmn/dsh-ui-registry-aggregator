name: CI

on:
  push:
    branches:
      - dsh-0.2.1-alpha.1
  pull_request:

permissions:
  contents: read

env:
  DSH_VERSION: 0.2.1-alpha.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --package-lock=false --legacy-peer-deps
      - name: Check JavaScript syntax
        run: |
          node --check index.js
          node --check client.js
          node --check source-core.js
      - run: npm test
      - run: npm pack --dry-run

  dsh-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install local plugin into isolated DSH 0.2.1-alpha.1 profile
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          pnpm dlx "@deepseek-ai/dsh@$DSH_VERSION" plugin --profile smoke add "file:$GITHUB_WORKSPACE"
          pnpm dlx "@deepseek-ai/dsh@$DSH_VERSION" --profile smoke --dump-config > /tmp/dsh-config.txt
          grep -F "registry-aggregator" /tmp/dsh-config.txt
          grep -F "@stolyarovmn/dsh-ui-registry-aggregator" /tmp/dsh-config.txt
