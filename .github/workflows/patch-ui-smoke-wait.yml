name: Patch RC4 UI smoke inventory wait

on:
  push:
    branches:
      - fix/rc4-icons-and-smoke
    paths:
      - .github/workflows/patch-ui-smoke-wait.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for real Plugin Manager inventory
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ui-smoke-rc4.yml')
          s = p.read_text()
          old = """            if (!await click('Plugins')) throw new Error('Plugins sidebar button not found')
            body = await waitText(/Install, enable, and configure plugins/i, 30)
            fs.writeFileSync('/tmp/ui-03-plugins.txt', body)
            if (!body.includes('Registry Aggregator') || !body.includes('Automation Tasks Attention')) {
              throw new Error('Installed plugin cards are missing in real RC4 Plugin Manager')
            }
"""
          new = """            if (!await click('Plugins')) throw new Error('Plugins sidebar button not found')
            body = await waitText(/Registry Aggregator/i, 60)
            fs.writeFileSync('/tmp/ui-03-plugins.txt', body)
            await screenshot('/tmp/ui-03-plugins.png')
            if (!body.includes('Registry Aggregator') || !body.includes('Automation Tasks Attention')) {
              throw new Error('Installed plugin cards did not load in real RC4 Plugin Manager: ' + body.slice(0, 1200))
            }
"""
          if old not in s:
              raise SystemExit('inventory wait anchor changed')
          p.write_text(s.replace(old, new))
          PY
          rm -f .github/workflows/ui-smoke-rc4-v2.yml .github/workflows/patch-ui-smoke-wait.yml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ui-smoke-rc4.yml .github/workflows/ui-smoke-rc4-v2.yml .github/workflows/patch-ui-smoke-wait.yml
          git commit -m "test: wait for RC4 Plugin Manager inventory"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
