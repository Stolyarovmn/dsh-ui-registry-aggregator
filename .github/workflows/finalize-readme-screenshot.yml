name: Finalize README screenshot

on:
  push:
    branches:
      - docs/finalize-v0.5.2-readme

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild exact screenshot and clean staging
        shell: bash
        run: |
          set -euo pipefail
          cat docs/screenshots/.tmp-exact-0.5.3/part* > /tmp/registry-aggregator-v0.5.2.png.b64
          base64 -d /tmp/registry-aggregator-v0.5.2.png.b64 > docs/screenshots/registry-aggregator-v0.5.2.png
          python - <<'PY'
          import struct
          p='docs/screenshots/registry-aggregator-v0.5.2.png'
          with open(p,'rb') as f:
              sig=f.read(8)
              if sig != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit('not a PNG')
              length=struct.unpack('>I',f.read(4))[0]
              typ=f.read(4)
              if typ != b'IHDR' or length < 8:
                  raise SystemExit('missing IHDR')
              w,h=struct.unpack('>II',f.read(8))
          print(f'PNG {w}x{h}')
          if w < 1400 or h < 700:
              raise SystemExit('screenshot unexpectedly small')
          PY
          rm -rf docs/screenshots/.tmp-exact-0.5.3 docs/screenshots/.tmp-fullres-0.5.3 docs/screenshots/.tmp-rgba-0.5.3
          rm -f .github/workflows/finalize-readme-screenshot.yml

      - name: Commit finalized docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m 'docs: finalize readable v0.5.2 screenshot'
          git push origin HEAD:docs/finalize-v0.5.2-readme
