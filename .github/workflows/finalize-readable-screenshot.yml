name: Finalize readable screenshot

on:
  push:
    branches:
      - docs/readable-v0.5.2-screenshot

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode screenshot and clean staging
        shell: bash
        run: |
          set -euo pipefail
          base64 -d docs/screenshots/.tmp-readme-hires/part00 > docs/screenshots/registry-aggregator-v0.5.2.png
          python - <<'PY'
          import struct
          p='docs/screenshots/registry-aggregator-v0.5.2.png'
          with open(p,'rb') as f:
              if f.read(8) != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit('not a PNG')
              length=struct.unpack('>I',f.read(4))[0]
              kind=f.read(4)
              if kind != b'IHDR' or length < 8:
                  raise SystemExit('missing IHDR')
              size=struct.unpack('>II',f.read(8))
          print('screenshot:', size)
          if size != (1538, 820):
              raise SystemExit(f'unexpected screenshot dimensions: {size}')
          PY
          rm -rf docs/screenshots/.tmp-readme-hires
          rm -f .github/workflows/finalize-readable-screenshot.yml
      - name: Commit finalized screenshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: replace README screenshot with readable crop'
          git push origin HEAD:docs/readable-v0.5.2-screenshot
