name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/publish.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Configure npm registry without token auth
        run: npm config set registry https://registry.npmjs.org/

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Verify release tag matches package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${{ github.event.release.tag_name }}" = "v$VERSION"

      - name: Install test dependencies
        run: npm install --package-lock=false --legacy-peer-deps

      - name: Test package
        run: npm test

      - name: Verify package contents
        run: npm run test:pack

      - name: Check whether this version is already published
        id: published
        shell: bash
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          CURRENT="$(npm view "$NAME@$VERSION" version 2>/dev/null || true)"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already published."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published.outputs.exists != 'true'
        shell: bash
        run: |
          unset NODE_AUTH_TOKEN
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi

      - name: Create or update GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          NOTES=".github/release-notes/v$VERSION.md"

          if [[ "$VERSION" == *-* ]]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              if [ -f "$NOTES" ]; then
                gh release edit "$TAG" --prerelease --notes-file "$NOTES"
              else
                gh release edit "$TAG" --prerelease
              fi
            elif [ -f "$NOTES" ]; then
              gh release create "$TAG" --target "$GITHUB_SHA" --title "$NAME $VERSION" --notes-file "$NOTES" --prerelease
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --title "$NAME $VERSION" --generate-notes --prerelease
            fi
          else
            if gh release view "$TAG" >/dev/null 2>&1; then
              if [ -f "$NOTES" ]; then gh release edit "$TAG" --notes-file "$NOTES"; fi
            elif [ -f "$NOTES" ]; then
              gh release create "$TAG" --target "$GITHUB_SHA" --title "$NAME $VERSION" --notes-file "$NOTES"
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --title "$NAME $VERSION" --generate-notes
            fi
          fi
