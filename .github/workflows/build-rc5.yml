name: Build RC5 polling bridge

on:
  push:
    branches:
      - fix/plugins-page-bridge-poll-020rc2

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build candidate from known-good rc1 base
        run: node scripts/build-rc5.mjs
      - name: Install test dependencies
        run: npm install --package-lock=false --legacy-peer-deps
      - name: Check JavaScript syntax
        run: |
          node --check index.js
          node --check client.js
          node --check source-core.js
      - run: npm test
      - run: npm pack --dry-run
      - name: Install local plugin into isolated DSH 0.2.0-rc.2 profile
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          corepack enable
          pnpm dlx @deepseek-ai/dsh@0.2.0-rc.2 plugin --profile smoke add "file:$GITHUB_WORKSPACE"
          pnpm dlx @deepseek-ai/dsh@0.2.0-rc.2 --profile smoke --dump-config > /tmp/dsh-config.txt
          grep -F "registry-aggregator" /tmp/dsh-config.txt
          grep -F "@stolyarovmn/dsh-ui-registry-aggregator" /tmp/dsh-config.txt
      - name: Commit generated candidate once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client.js package.json test/skeleton.test.js
          if git diff --cached --quiet; then
            echo "candidate already generated"
          else
            git commit -m "fix: defer plugins page bridge until native inventory is ready"
            git push
          fi
