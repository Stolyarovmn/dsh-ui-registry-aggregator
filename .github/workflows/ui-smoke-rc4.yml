name: DSH rc4 browser UI smoke

on:
  push:
    branches:
      - fix/rc4-icons-and-smoke
    paths:
      - client.js
      - source-core.js
      - package.json
      - cordis.patch.yml
      - locale/**
      - .github/workflows/ui-smoke-rc4.yml
  pull_request:
    paths:
      - client.js
      - source-core.js
      - package.json
      - cordis.patch.yml
      - locale/**
      - .github/workflows/ui-smoke-rc4.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc4-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Registry Aggregator
        uses: actions/checkout@v4

      - name: Checkout Schedule Tab candidate
        uses: actions/checkout@v4
        with:
          repository: Stolyarovmn/dsh-schedule-tab
          ref: d57666e6024cdf9fda02e7cf384c11065b00cead
          path: .schedule-plugin

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install both candidates into a real DSH 0.2.1-rc.4 Web profile
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        shell: bash
        run: |
          set -euo pipefail
          DSH='pnpm dlx @deepseek-ai/dsh@0.2.1-rc.4'
          $DSH --profile ui-rc4 --from-default-profile web --dump-config > /tmp/dsh-base-config.txt
          $DSH plugin --profile ui-rc4 add "file:$GITHUB_WORKSPACE"
          $DSH plugin --profile ui-rc4 add "file:$GITHUB_WORKSPACE/.schedule-plugin"
          $DSH --profile ui-rc4 --dump-config > /tmp/dsh-config.txt
          grep -F '@stolyarovmn/dsh-ui-registry-aggregator' /tmp/dsh-config.txt
          grep -F '@stolyarovmn/dsh-client-ui-schedule-tab' /tmp/dsh-config.txt

      - name: Start real DSH Web
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx @deepseek-ai/dsh@0.2.1-rc.4 --profile ui-rc4 --port 3080 --no-open > /tmp/dsh-web.log 2>&1 &
          echo $! > /tmp/dsh.pid
          for i in $(seq 1 60); do
            if grep -Eq 'dsh web: http://127\.0\.0\.1:' /tmp/dsh-web.log; then break; fi
            if ! kill -0 "$(cat /tmp/dsh.pid)" 2>/dev/null; then
              cat /tmp/dsh-web.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/dsh-web.log
          URL="$(grep -Eo 'http://127\.0\.0\.1:[^[:space:]]+' /tmp/dsh-web.log | head -n1)"
          test -n "$URL"
          printf '%s' "$URL" > /tmp/dsh-url.txt

      - name: Exercise Plugin Manager Browse in Chromium and verify both SVG artworks
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 about:blank > /tmp/chrome.log 2>&1 &
          echo $! > /tmp/chrome.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9222/json/version >/tmp/chrome-version.json 2>/dev/null && break
            sleep 1
          done
          node <<'NODE'
          const fs = require('node:fs')
          const url = fs.readFileSync('/tmp/dsh-url.txt', 'utf8').trim()
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms))

          async function main() {
            const pages = await fetch('http://127.0.0.1:9222/json/list').then(r => r.json())
            const page = pages.find(p => p.type === 'page')
            if (!page?.webSocketDebuggerUrl) throw new Error('Chromium page debugger target not found')
            const ws = new WebSocket(page.webSocketDebuggerUrl)
            await new Promise((resolve, reject) => { ws.onopen = resolve; ws.onerror = reject })
            let seq = 0
            const pending = new Map()
            ws.onmessage = event => {
              const message = JSON.parse(event.data)
              if (!message.id) return
              const waiter = pending.get(message.id)
              if (!waiter) return
              pending.delete(message.id)
              if (message.error) waiter.reject(new Error(JSON.stringify(message.error)))
              else waiter.resolve(message.result)
            }
            const call = (method, params = {}) => new Promise((resolve, reject) => {
              const id = ++seq
              pending.set(id, { resolve, reject })
              ws.send(JSON.stringify({ id, method, params }))
            })
            const evaluate = async expression => {
              const result = await call('Runtime.evaluate', { expression, awaitPromise: true, returnByValue: true })
              if (result.exceptionDetails) throw new Error(result.exceptionDetails.text || 'Runtime.evaluate failed')
              return result.result?.value
            }
            const bodyText = () => evaluate('document.body?.innerText || ""')
            const clickControl = label => evaluate(`(() => {
              const wanted=${JSON.stringify(label.toLowerCase())}
              const nodes=[...document.querySelectorAll('button,a,[role="button"],[role="tab"],[aria-label],[title],div,span')]
              const exact=nodes.find(n => (n.textContent || '').trim().toLowerCase()===wanted)
              const labelled=nodes.find(n => [n.getAttribute('aria-label'), n.getAttribute('title')].some(v => v && v.trim().toLowerCase()===wanted))
              const el=exact || labelled
              if(!el) return false
              el.click()
              return true
            })()`)
            const dumpControls = () => evaluate(`(() => [...document.querySelectorAll('button,a,[role="button"],[role="tab"],[aria-label],[title]')].slice(0,300).map((n,i)=>({i,tag:n.tagName,text:(n.textContent||'').trim().slice(0,120),aria:n.getAttribute('aria-label'),title:n.getAttribute('title'),role:n.getAttribute('role')})))()`)
            const search = value => evaluate(`(() => {
              const input=[...document.querySelectorAll('input')].find(i => /search/i.test(i.placeholder || '') || /search/i.test(i.getAttribute('aria-label') || ''))
              if(!input) return false
              const setter=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set
              setter.call(input, ${JSON.stringify(value)})
              input.dispatchEvent(new Event('input',{bubbles:true}))
              input.dispatchEvent(new Event('change',{bubbles:true}))
              return true
            })()`)
            const artworkFor = packageName => evaluate(`(() => {
              const name=${JSON.stringify(packageName)}
              const cards=[...document.querySelectorAll('.ra-plugin-card')]
              const card=cards.find(c => c.textContent?.includes(name))
              if(!card) return {found:false}
              const img=card.querySelector('img.ra-plugin-image')
              return {found:true, src:img?.getAttribute('src') || '', image:!!img, text:card.textContent}
            })()`)
            const capture = async path => {
              const shot = await call('Page.captureScreenshot', { format: 'png', fromSurface: true, captureBeyondViewport: false })
              fs.writeFileSync(path, Buffer.from(shot.data, 'base64'))
            }
            const waitForText = async (pattern, attempts = 30) => {
              for (let i = 0; i < attempts; i += 1) {
                const text = await bodyText()
                if (pattern.test(text)) return text
                await sleep(500)
              }
              return bodyText()
            }

            await call('Page.enable')
            await call('Runtime.enable')
            await call('Emulation.setDeviceMetricsOverride', { width: 1600, height: 1000, deviceScaleFactor: 1, mobile: false })
            await call('Page.navigate', { url })
            await sleep(4500)
            let text = await bodyText()
            fs.writeFileSync('/tmp/ui-initial.txt', text)
            await capture('/tmp/ui-initial.png')

            // Fresh RC4 profiles start behind Preview Notice. This is product
            // onboarding, not plugin UI, so pass it before asserting sidebar state.
            if (/Preview Notice/i.test(text) && /Continue/i.test(text)) {
              if (!await clickControl('Continue')) throw new Error('Preview Notice is visible but Continue could not be activated')
              await sleep(1800)
              text = await bodyText()
              fs.writeFileSync('/tmp/ui-after-preview.txt', text)
            }

            // Hosted runners have no remembered workspace. Adopt the currently
            // displayed directory in the real browse picker so the normal shell
            // and sidebar mount exactly as they do after first-run setup.
            if (/Choose workspace/i.test(text)) {
              if (!await clickControl('Choose workspace')) throw new Error('Choose workspace is visible but could not be activated')
              text = await waitForText(/Select Workspace Directory/i, 20)
              fs.writeFileSync('/tmp/ui-workspace-picker.txt', text)
              await capture('/tmp/ui-workspace-picker.png')
              if (!/Select Workspace Directory/i.test(text)) throw new Error('Workspace directory browser did not open')
              if (!await clickControl('Open')) throw new Error('Workspace directory browser has no Open action')
              await sleep(2500)
              text = await bodyText()
              fs.writeFileSync('/tmp/ui-after-workspace.txt', text)
            }

            // Plugin Manager is a global sidebar panel. RC4 renders icon-only
            // sidebar controls, so accept either visible text or accessible label/title.
            if (!/Browse plugins/i.test(text)) {
              if (!await clickControl('Plugins')) {
                fs.writeFileSync('/tmp/ui-controls.json', JSON.stringify(await dumpControls(), null, 2))
                await capture('/tmp/ui-no-plugins.png')
                throw new Error('Could not locate Plugins sidebar control in real DSH UI')
              }
              await sleep(2500)
              text = await bodyText()
              fs.writeFileSync('/tmp/ui-plugin-manager.txt', text)
            }
            if (!/Browse plugins/i.test(text)) {
              if (!await clickControl('Browse')) {
                fs.writeFileSync('/tmp/ui-controls.json', JSON.stringify(await dumpControls(), null, 2))
                await capture('/tmp/ui-no-browse.png')
                throw new Error('Could not locate Browse tab in real DSH Plugin Manager')
              }
              text = await waitForText(/Browse plugins/i, 20)
            } else {
              await clickControl('Browse')
              await sleep(1200)
              text = await bodyText()
            }
            if (!/Browse plugins/i.test(text)) throw new Error('Browse view did not become active')

            for (const packageName of ['@stolyarovmn/dsh-client-ui-schedule-tab', '@stolyarovmn/dsh-ui-registry-aggregator']) {
              const query = packageName.split('/').pop()
              if (!await search(query)) throw new Error('Browse search input not found')
              let result
              for (let i = 0; i < 30; i += 1) {
                await sleep(500)
                result = await artworkFor(packageName)
                if (result?.found && result.image) break
              }
              if (!result?.found) throw new Error(`Browse did not render ${packageName}`)
              if (!result.image || !result.src.startsWith('data:image/svg+xml;base64,')) {
                throw new Error(`${packageName} did not render SVG artwork: ${JSON.stringify(result)}`)
              }
              fs.appendFileSync('/tmp/artwork-results.txt', `${packageName}\t${result.src.slice(0, 40)}\n`)
            }

            fs.writeFileSync('/tmp/ui-final.txt', await bodyText())
            await capture('/tmp/registry-rc4-browse.png')
            ws.close()
          }
          main().catch(error => { console.error(error); process.exit(1) })
          NODE
          cat /tmp/artwork-results.txt

      - name: Reject runtime crashes
        if: always()
        shell: bash
        run: |
          cat /tmp/dsh-web.log || true
          ! grep -Eiq 'Failed to load plugins|entry did not activate|web boot: .*failed|slot entry crashed|fatal uncaught exception' /tmp/dsh-web.log

      - name: Upload real UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-0.2.1-rc.4-registry-ui
          path: |
            /tmp/*.png
            /tmp/ui-*.txt
            /tmp/ui-controls.json
            /tmp/artwork-results.txt
            /tmp/dsh-web.log
          if-no-files-found: warn
