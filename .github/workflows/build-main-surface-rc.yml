name: Build Plugins main surface RC

on:
  push:
    branches:
      - feat/plugins-main-section
    paths:
      - .github/workflows/build-main-surface-rc.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/plugins-main-section
          fetch-depth: 0

      - name: Build Registry Aggregator RC
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          client_path = root / 'client.js'
          client = client_path.read_text()

          old = "    function RegistryAggregator({ t, view }) {\n      const [tab, setTab] = React.useState('sources')\n      const updateDiscovery = useUpdateDiscovery(view === 'page')\n"
          new = "    function RegistryAggregator({ t, view }) {\n      const active = view === undefined || view === 'page'\n      const [tab, setTab] = React.useState('sources')\n      const updateDiscovery = useUpdateDiscovery(active)\n"
          assert old in client, 'RegistryAggregator activation anchor not found'
          client = client.replace(old, new, 1)

          old = "      if (view !== 'page') return null\n"
          new = "      if (!active) return null\n"
          assert old in client, 'RegistryAggregator view guard not found'
          client = client.replace(old, new, 1)

          old = """        ctx.effect(() => ctx.configForms.whileServed([HOST_ENTRY], () =>
          ctx.slots.inject('plugins.bundle.config', () => ctx.slots.register({
            name: 'plugins.bundle.config',
            key: PACKAGE,
            locale: NS,
          }, RegistryAggregator))), 'registry-aggregator: bundle page')
"""
          new = """        ctx.effect(() => ctx.configForms.whileServed([HOST_ENTRY], () =>
          ctx.slots.inject('plugins.main.section', () => ctx.slots.register({
            name: 'plugins.main.section',
            id: 'registry-aggregator',
            order: 100,
            locale: NS,
          }, RegistryAggregator))), 'registry-aggregator: Plugins main page')
        ctx.effect(() => ctx.configForms.whileServed([HOST_ENTRY], () =>
          ctx.slots.inject('plugins.bundle.config', () => ctx.slots.register({
            name: 'plugins.bundle.config',
            key: PACKAGE,
            locale: NS,
          }, RegistryAggregator))), 'registry-aggregator: bundle page fallback')
"""
          assert old in client, 'slot registration anchor not found'
          client = client.replace(old, new, 1)
          client_path.write_text(client)

          pkg_path = root / 'package.json'
          pkg = json.loads(pkg_path.read_text())
          assert pkg['version'] == '0.5.2-rc.1', pkg['version']
          pkg['version'] = '0.5.2-rc.2'
          pkg_path.write_text(json.dumps(pkg, indent=2, ensure_ascii=False) + '\n')

          test_path = root / 'test' / 'skeleton.test.js'
          test = test_path.read_text()
          old = "test('uses the native bundle slot but binds the Host entry form explicitly', () => {\n  assert.match(client, /plugins\\.bundle\\.config/)\n"
          new = "test('uses the native Plugins main slot with bundle-detail fallback and binds the Host entry form explicitly', () => {\n  assert.match(client, /plugins\\.main\\.section/)\n  assert.match(client, /name: 'plugins\\.main\\.section'/)\n  assert.match(client, /id: 'registry-aggregator'/)\n  assert.match(client, /order: 100/)\n  assert.match(client, /plugins\\.bundle\\.config/)\n"
          assert old in test, 'slot test anchor not found'
          test = test.replace(old, new, 1)
          test += """

test('main Plugins surface and bundle fallback share the same Registry Aggregator view safely', () => {
  assert.match(client, /const active = view === undefined \\|\\| view === 'page'/)
  assert.match(client, /useUpdateDiscovery\\(active\\)/)
  assert.match(client, /if \\(!active\\) return null/)
  assert.match(client, /registry-aggregator: Plugins main page/)
  assert.match(client, /registry-aggregator: bundle page fallback/)
})
"""
          test_path.write_text(test)

          readme_path = root / 'README.md'
          readme = readme_path.read_text()
          readme = readme.replace('Current test version: `0.5.2-rc.1`', 'Current test version: `0.5.2-rc.2`')
          marker = '## Install from npm\n'
          section = """## Native Plugins main-page integration\n\n`0.5.2-rc.2` can render Registry Aggregator directly on the native Plugins list through the additive `plugins.main.section` slot. Stock DSH `0.2.0-rc.2` does not declare that slot, so this branch includes an exact version-matched Harness patch at `docs/dsh-v0.2.0-rc.2-plugins-main-section.patch`. The existing `plugins.bundle.config` registration remains as a fallback on stock Harness builds.\n\nFor manual UI validation use the instructions in `docs/DSH_0.2.0_RC2_MAIN_SECTION.md`.\n\n"""
          if section not in readme:
              assert marker in readme, 'README install marker not found'
              readme = readme.replace(marker, section + marker, 1)
          readme_path.write_text(readme)
          PY

      - name: Generate exact DSH 0.2.0-rc.2 host patch
        shell: bash
        run: |
          rm -rf /tmp/deepseek-harness
          git clone --depth 1 --branch dsh-v0.2.0-rc.2 https://github.com/deepseek-ai/deepseek-harness.git /tmp/deepseek-harness
          test "$(git -C /tmp/deepseek-harness rev-parse HEAD)" = "639ed015397290b3745d163aafe02ffee4aa3f84"

          python <<'PY'
          from pathlib import Path
          root = Path('/tmp/deepseek-harness')

          p = root / 'packages/client/ui-plugin-manager/src/client/slot-contract.ts'
          s = p.read_text()
          a = """  interface SlotMap {
    /** Optional guidance after the user enables a bundle from the list, keyed by npm package name. */
"""
          b = """  interface SlotMap {
    /** Additive sections rendered on the Plugins list after the native Official and Installed groups. */
    'plugins.main.section': { kind: 'list'; scope: 'root'; owner: Record<never, never> }
    /** Optional guidance after the user enables a bundle from the list, keyed by npm package name. */
"""
          assert a in s
          p.write_text(s.replace(a, b, 1))

          p = root / 'packages/client/ui-plugin-manager/src/client/index.ts'
          s = p.read_text()
          a = """      children: {
        'plugins.item': { kind: 'list', scope: 'root' },
"""
          b = """      children: {
        'plugins.main.section': { kind: 'list', scope: 'root' },
        'plugins.item': { kind: 'list', scope: 'root' },
"""
          assert a in s
          p.write_text(s.replace(a, b, 1))

          p = root / 'packages/client/ui-plugin-manager/src/client/PluginManagerPage.tsx'
          s = p.read_text()
          a = """  & PropsRenderSlots<
    | 'plugins.item' | 'plugins.bundle.config' | 'plugins.row.config' | 'plugins.bundle.activation'
    | 'plugins.detail.actions' | 'plugins.detail.badge' | 'plugins.detail.section'
  >
"""
          b = """  & PropsRenderSlots<
    | 'plugins.main.section' | 'plugins.item' | 'plugins.bundle.config' | 'plugins.row.config' | 'plugins.bundle.activation'
    | 'plugins.detail.actions' | 'plugins.detail.badge' | 'plugins.detail.section'
  >
"""
          assert a in s
          s = s.replace(a, b, 1)
          a = """        : null}
      {showsCards && activated !== undefined && !state.install.open
"""
          b = """        : null}
      {loaded && showsCards ? renderSlot('plugins.main.section', {}) : null}
      {showsCards && activated !== undefined && !state.install.open
"""
          assert a in s
          p.write_text(s.replace(a, b, 1))

          p = root / 'packages/client/ui-plugin-manager/tests/browser-plugin.client.spec.tsx'
          s = p.read_text()
          a = """    expect(b.slots.spec('plugins.item')).toMatchObject({ kind: 'list', scope: 'root' })
"""
          b = """    expect(b.slots.spec('plugins.main.section')).toMatchObject({ kind: 'list', scope: 'root' })
    expect(b.slots.spec('plugins.item')).toMatchObject({ kind: 'list', scope: 'root' })
"""
          assert a in s
          p.write_text(s.replace(a, b, 1))
          PY

          mkdir -p docs
          git -C /tmp/deepseek-harness diff -- \
            packages/client/ui-plugin-manager/src/client/slot-contract.ts \
            packages/client/ui-plugin-manager/src/client/index.ts \
            packages/client/ui-plugin-manager/src/client/PluginManagerPage.tsx \
            packages/client/ui-plugin-manager/tests/browser-plugin.client.spec.tsx \
            > docs/dsh-v0.2.0-rc.2-plugins-main-section.patch

          test -s docs/dsh-v0.2.0-rc.2-plugins-main-section.patch
          git -C /tmp/deepseek-harness diff --check
          git -C /tmp/deepseek-harness reset --hard HEAD
          git -C /tmp/deepseek-harness apply --check "$GITHUB_WORKSPACE/docs/dsh-v0.2.0-rc.2-plugins-main-section.patch"

      - name: Document manual validation
        shell: bash
        run: |
          cat > docs/DSH_0.2.0_RC2_MAIN_SECTION.md <<'EOF'
          # DSH 0.2.0-rc.2 — Registry Aggregator on the native Plugins page

          Target Harness: `dsh-v0.2.0-rc.2` (`639ed015397290b3745d163aafe02ffee4aa3f84`).

          Stock `0.2.0-rc.2` does not expose a main-page list slot for an additive Registry section. The companion patch `dsh-v0.2.0-rc.2-plugins-main-section.patch` adds the smallest host-owned extension point required by the plugin:

          - declares `plugins.main.section` as a root-scoped list slot;
          - exposes it from the native Plugin Manager `main` registration;
          - renders contributions after the native Official and Installed groups, only in list view;
          - adds a browser contract assertion for the new slot.

          Registry Aggregator `0.5.2-rc.2` registers into that slot and retains `plugins.bundle.config` as a stock-Harness fallback.

          ## Manual validation on Windows / PowerShell

          ```powershell
          $DSH_REPO = "$HOME\src\deepseek-harness-0.2.0-rc.2-main-section"
          $PLUGIN_COMMIT = "REPLACE_WITH_FINAL_RC_COMMIT"
          $PROFILE = "dsh-020-main-section-test"
          $env:DSH_HOME = "$env:USERPROFILE\.dsh-020-main-section-test"

          if (Test-Path $DSH_REPO) { Remove-Item -Recurse -Force $DSH_REPO }
          git clone --branch dsh-v0.2.0-rc.2 --depth 1 https://github.com/deepseek-ai/deepseek-harness.git $DSH_REPO
          Set-Location $DSH_REPO

          Invoke-WebRequest `
            "https://raw.githubusercontent.com/Stolyarovmn/dsh-ui-registry-aggregator/$PLUGIN_COMMIT/docs/dsh-v0.2.0-rc.2-plugins-main-section.patch" `
            -OutFile "$env:TEMP\dsh-plugins-main-section.patch"

          git apply --check "$env:TEMP\dsh-plugins-main-section.patch"
          git apply "$env:TEMP\dsh-plugins-main-section.patch"

          corepack enable
          pnpm install --frozen-lockfile
          pnpm run build

          pnpm dsh plugin --profile $PROFILE add "github:Stolyarovmn/dsh-ui-registry-aggregator#$PLUGIN_COMMIT"
          pnpm dsh --profile $PROFILE
          ```

          Expected result on the main **Plugins** list: native Official and Installed groups remain unchanged; below them Registry Aggregator renders `Sources | Browse | Updates N`. Opening the Registry Aggregator package detail still renders the existing fallback UI.

          Do not publish or merge this RC until the real Harness UI has been checked.
          EOF

      - name: Validate plugin and patch
        shell: bash
        run: |
          node --check client.js
          node --check index.js
          node --check source-core.js
          npm test
          npm pack --dry-run
          git diff --check

      - name: Commit RC candidate
        shell: bash
        run: |
          rm .github/workflows/build-main-surface-rc.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add client.js package.json README.md test/skeleton.test.js docs/dsh-v0.2.0-rc.2-plugins-main-section.patch docs/DSH_0.2.0_RC2_MAIN_SECTION.md .github/workflows/build-main-surface-rc.yml
          git diff --cached --check
          git commit -m "feat: add native Plugins main section RC"
          git push origin HEAD:feat/plugins-main-section
