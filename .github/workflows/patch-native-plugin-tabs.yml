name: Migrate Registry tabs to native Plugin Manager slot

on:
  push:
    branches: [fix/rc4-icons-and-smoke]
    paths:
      - .github/workflows/patch-native-plugin-tabs.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply native plugins.tab migration
        run: python3 .github/scripts/patch-native-tabs.py
      - name: Verify patched client
        run: |
          node --check client.js
          npm install --package-lock=false --legacy-peer-deps
          npm test
      - name: Commit migration
        shell: bash
        run: |
          rm -f .github/workflows/patch-native-plugin-tabs.yml .github/scripts/patch-native-tabs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client.js test/skeleton.test.js .github/workflows/patch-native-plugin-tabs.yml .github/scripts/patch-native-tabs.py
          git commit -m "fix: use native DSH Plugin Manager tabs"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
